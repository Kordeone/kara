[package]
name = "kara"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "A native task and productivity manager for the COSMIC™ desktop"
repository = "https://github.com/Kordeone/kara"

[dependencies]
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jiff = "0.2"
getrandom = "0.4"
tempfile = "3"
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

# Already locked through libcosmic; names the accessibility return type in the
# Matrix drop-viewport wrapper so native accessibility remains delegated.
iced_accessibility = { git = "https://github.com/pop-os/libcosmic.git" }

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # Accessible names for icon-only controls
    "a11y",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Markdown widget
    "markdown",
    # QR code widget
    "qr_code",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
