name: AppImage testing artifact

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned Ubuntu 22.04 tool environment
        run: |
          docker build --tag kara-appimage-builder \
            --build-arg CI_UID="$(id -u)" --build-arg CI_GID="$(id -g)" \
            --file packaging/ci/Containerfile packaging/ci
      - name: Validate and build from locked sources
        env:
          CI_WORK: ${{ runner.temp }}/kara-appimage
        run: |
          mkdir -p "$CI_WORK"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$CI_WORK:/work" \
            kara-appimage-builder \
            bash /source/packaging/ci/build-appimage.sh /work/candidate
      - name: Record actual artifact size and checksum
        env:
          CI_WORK: ${{ runner.temp }}/kara-appimage
        run: cat "$CI_WORK/candidate/artifacts/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload testing artifact and validation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Kara-AppImage-x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/kara-appimage/candidate/artifacts/*.AppImage
            ${{ runner.temp }}/kara-appimage/candidate/artifacts/*.sha256
            ${{ runner.temp }}/kara-appimage/candidate/artifacts/*.json
            ${{ runner.temp }}/kara-appimage/candidate/artifacts/*.txt
            ${{ runner.temp }}/kara-appimage/candidate/artifacts/summary.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
